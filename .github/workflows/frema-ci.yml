# Continuous integration for FREMA (the ASP.NET Core app under FREMA/).
#
# Runs on every push and pull request that touches FREMA, and weekly, because new security
# advisories arrive without any code changing: NuGet's audit fails the restore and `npm audit`
# fails the frontend job when a dependency becomes vulnerable.
#
# The Next.js prototype at the repository root is not built here; it is being retired.

name: FREMA CI

on:
  push:
    branches: [master]
    paths:
      - "FREMA/**"
      - ".github/workflows/frema-ci.yml"
  pull_request:
    paths:
      - "FREMA/**"
      - ".github/workflows/frema-ci.yml"
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frema-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — build, test, migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FREMA
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      # The integration tests create, seed and drop their own database on this server. The
      # password only protects a throwaway container that lives for this job.
      FREMA_TEST_SQL: "Server=localhost,1433;User Id=sa;Password=CiTest-Passw0rd2026;TrustServerCertificate=True;Encrypt=False"
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "CiTest-Passw0rd2026"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P CiTest-Passw0rd2026 -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # NuGet audit runs during restore, and FREMA.csproj treats warnings as errors, so a
      # package with a known vulnerability fails the build here.
      - name: Restore
        run: dotnet restore FREMA.slnx

      - name: Build (warnings are errors)
        run: dotnet build FREMA.slnx --no-restore --configuration Release

      # Workflow rules, document visibility, and a sweep of every /api endpoint for missing
      # authorization, against the real app and a real SQL Server.
      - name: Test
        run: dotnet test FREMA.slnx --no-build --configuration Release --logger "console;verbosity=normal"

      # Fails if someone changed the domain model without adding a migration. Only the model
      # is built; nothing connects to the placeholder connection string.
      - name: Migrations match the model
        env:
          ConnectionStrings__Default: "Server=ci;Database=FREMA;Trusted_Connection=True;TrustServerCertificate=True"
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.11
          dotnet ef migrations has-pending-model-changes --project src/FREMA --configuration Release --no-build

  frontend:
    name: Frontend — audit, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FREMA/src/FREMA/ClientApp
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: FREMA/src/FREMA/ClientApp/package-lock.json

      # The build vendors OpenCV.js (~10 MB) from docs.opencv.org. Cache it, so CI does not
      # depend on that site being up or download it on every run.
      - uses: actions/cache@v5
        with:
          path: FREMA/src/FREMA/ClientApp/public/vendor
          key: opencv-${{ hashFiles('FREMA/src/FREMA/ClientApp/scripts/fetch-opencv.mjs') }}

      - name: Install
        run: npm ci

      - name: Audit dependencies (high and critical fail the build)
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build
